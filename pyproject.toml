[project]
name = "core-backend"
version = "0.1.0"
description = "FastAPI boilerplate with async SQLAlchemy and PostgreSQL"
authors = [
    { name = "Matteo Le Bars", email = "matteo.lebars.mb@gmail.com" },
]
requires-python = ">=3.14, <4"
dependencies = [
    "uvicorn>=0.41.0",
    "fastapi>=0.135.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.17.0",
    "uuid6>=2025.0.1",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "structlog>=25.5.0",
    "python-multipart>=0.0.22",
    "rich>=14.3.3",
    "alembic>=1.18.4",
]

[dependency-groups]
dev = [
    "pytest>=7.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["src/"]
packages = ["src/app"]
