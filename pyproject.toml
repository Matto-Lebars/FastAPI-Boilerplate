[project]
name = "fastapi-boilerplate"
version = "0.1.0"
description = "FastAPI boilerplate with async SQLAlchemy and PostgreSQL"
authors = [
    { name = "Matteo Le Bars", email = "matteo.lebars.mb@gmail.com" },
]
requires-python = ">=3.14, <4"
dependencies = [
    "uvicorn>=0.41.0",
    "fastapi>=0.135.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.17.0",
    "uuid6>=2025.0.1",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "structlog>=25.5.0",
    "python-multipart>=0.0.22",
    "rich>=14.3.3",
    "alembic>=1.18.4",
]

[dependency-groups]
dev = [
    "pytest>=7.4.2",
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-material>=9.5.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["src/"]
packages = ["src/app"]

# ---------------------------------------------------------------------------
# Ruff – linter & formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle errors / warnings
    "I",      # isort (import ordering)
    "C",       # mccabe complexity
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
]
ignore = [
    "B008",   # do not perform function calls in argument defaults (needed for FastAPI Depends())
    "RET504", # unnecessary assignment before return
    "N802",  # function name should be lowercase (settings methods can be uppercase)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.mccabe]
max-complexity = 24

[tool.ruff.lint.pydocstyle]
convention = "numpy"

