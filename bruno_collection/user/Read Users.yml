info:
  name: Read Users
  type: http
  seq: 3

http:
  method: GET
  url: http://{{ip}}/api/v1/users?page=1&items_per_page=10
  params:
    - name: page
      value: "1"
      type: query
    - name: items_per_page
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
