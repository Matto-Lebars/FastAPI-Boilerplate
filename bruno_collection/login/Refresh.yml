info:
  name: Refresh
  type: http
  seq: 2

http:
  method: POST
  url: http://{{ip}}/api/v1/login
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: username
        value: "{{username}}"
      - name: password
        value: "{{password}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
